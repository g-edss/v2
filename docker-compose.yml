# ============================================================
#  Entorno local de WEB 360 de Calidad
#  Levanta PostgreSQL + Adminer (visor web de la BD) con un
#  solo comando:  docker compose up -d
#  Las migraciones de database/migrations se ejecutan solas
#  la primera vez que se crea el volumen.
# ============================================================
services:
  db:
    image: postgres:16
    container_name: web360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-web360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave}
      POSTGRES_DB: ${POSTGRES_DB:-web360_calidad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - web360_pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_esquema_inicial.sql:/docker-entrypoint-initdb.d/001_esquema_inicial.sql:ro
      - ./database/migrations/002_agregar-autenticacion.sql:/docker-entrypoint-initdb.d/002_agregar-autenticacion.sql:ro
      - ./database/migrations/003_catalogo_auditores.sql:/docker-entrypoint-initdb.d/003_catalogo_auditores.sql:ro
      - ./database/migrations/004_catalogo_indicadores.sql:/docker-entrypoint-initdb.d/004_catalogo_indicadores.sql:ro
      - ./database/seeds/001_catalogos.sql:/docker-entrypoint-initdb.d/010_catalogos.sql:ro
      - ./database/seeds/002_unidades_medida.sql:/docker-entrypoint-initdb.d/011_unidades_medida.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: web360_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
    container_name: web360_backend
    environment:
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-web360}:${POSTGRES_PASSWORD:-cambiar_esta_clave}@db:5432/${POSTGRES_DB:-web360_calidad}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: web360_frontend
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  web360_pgdata:
  backend_node_modules:
  frontend_node_modules: